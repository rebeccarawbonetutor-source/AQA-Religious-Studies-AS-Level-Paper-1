{paper:"JUN26",qref:"2 (b)",ao:"AO2",type:"Assess",area:"Philosophy of Religion",topic:"Problem of evil",question:"'Hick's soul making theodicy solves the problem of evil.' Assess this view.",target:"AO2: Analyse and evaluate aspects of, and approaches to, religion and belief, including their significance, influence and study.",spec:"The problem of evil and suffering: Hick's soul making theodicy.",cap:"",content:["Hick's theodicy solves the problem of evil as it suggests God allows evil to exist so people learn and develop by it. Because of the epistemic distance, it is not possible for God to create fully formed good people. People encounter evil in the world to develop into mature beings. However, even if the epistemic distance were a logical possibility, it does not justify the existence of purposeless evils, for example, a child dying of cancer or mass murder.","Hick's theodicy also asserts universal salvation, because a benevolent God would not condemn people to eternal damnation. Universal salvation is the only logical outcome if belief in God's benevolence is to remain intact. However, others argue this is unjust, because it fails to deal with the extremes to which some commit evil acts. It also undermines the purpose of life if the judgement or outcome is already certain.","Hick's theodicy solves the issue of natural evil. Hick argues the occurrence of natural evil is beyond human understanding, but humanity can develop compassion and a sense of responsibility for the environment through awareness of, and responding to, natural disasters. However, whilst Hick may account for human suffering, he fails to explain satisfactorily reasons for animal suffering. Unlike humans, animals have no possibility of salvation or developing second order goods, so their suffering is unjustified."]},
{paper:"JUN26",qref:"3 (a)",ao:"AO1.4",type:"Explain",area:"Ethics",topic:"Virtue ethics (lying)",question:"Explain the approach taken to moral decision making by virtue ethics. You should illustrate your answer with reference to the issue of lying.",target:"AO1.4: Knowledge and understanding of religion and belief, including approaches to the study of religion and belief.",spec:"",cap:"",content:["For Aristotle, every action aims at some good. Eudaimonia, the good, is an activity of the soul in accord with virtue, and where several virtues are involved, in accord with the best one. Moral virtues are formed by habit and by imitating virtuous people, acting with a thorough knowledge of the situation. Virtues lie in a mean between the vices of excess and deficiency. The mean is relative to the natural disposition of the individual agent. Virtues include courage, generosity, high-mindedness, right ambition and truthfulness.","Aristotle discusses the social qualities of truth and falsehood. For example, he says, 'falsehood is bad, while the truth is fine and praiseworthy.' When Aristotle says falsehood is bad, he appears to be saying that lying is always wrong. Aristotle is talking about lying about oneself. On one side boasting is a vice of excess, and on the other, false modesty is a deficiency. Telling the truth is the mean and so is the virtuous action.","Virtue Ethics also states that in situations where several virtues are involved, a virtuous person will act in accord with the best. Since a virtuous person regards the virtues as a synergy, there are occasions when lying can be defended. For example, it may be acceptable to lie to protect someone's life. This balances the virtues, of courage, empathy and friendship against the virtues of honesty and truthfulness. Lying in this situation may be the right thing to do."]},
{paper:"JUN26",qref:"3 (b)",ao:"AO2",type:"Assess",area:"Ethics",topic:"Embryo research",question:"'Embryo research can never be morally justified.' Assess this view.",target:"AO2: Analyse and evaluate aspects of, and approaches to, religion and belief, including their significance, influence and study.",spec:"Issues of human life and death: embryo research.",cap:"",content:["Some agree because, if the embryo is viewed as a person from the moment of conception, then it has the moral rights of a person and should be protected. Destroying an embryo at any stage of development is equivalent to murder. However, others believe that life and personhood begin at a later stage of gestation. Until that stage, the embryo is merely a collection of cells and only a potential life, and thus embryo research is morally justifiable within a restricted time frame.","Some argue that embryo research breaks many of the primary precepts of Natural Moral Law and is morally wrong. For example, it negates the principles concerning procreation and the protection of innocent life. However, others, for example those who might apply Situation Ethics, may argue that the agapeic benefits of embryo research in developing cures for a variety of diseases, which affect actual persons, is more important than any issue surrounding a potential person.","For Natural Moral Law, the argument that embryo research has the potential to cure human disease does not pass the principle of double effect, since it is not permissible to do a bad act to achieve good. However, others argue such a view is outdated. Modern medical science has developed procedures that have the potential to enhance human life and end suffering, which should be embraced in the modern world. The end can justify the means."]},
{paper:"JUN26",qref:"4 (a)",ao:"AO1.3",type:"Explain",area:"Ethics",topic:"Blood sports (NML &amp; SE)",question:"Explain why Natural Moral Law and Situation Ethics might reach different decisions about the use of animals in blood sports.",target:"AO1.3: Knowledge and understanding of religion and belief, including cause and significance of similarities and differences in belief, teaching and practice.",spec:"",cap:"",content:["Using animals in blood sports meets no fundamental objection from Natural Moral Law because humans are at the top of the hierarchy of souls. Animals were created for any use to which humans choose to put them and this includes their use in blood sports. In contrast Situation Ethics does not employ a hierarchy of souls and is more concerned with people rather than animals. This does not mean animals are of no concern in Situation Ethics, but human interests generally take priority. This means Situation Ethics is neutral about blood sports.","In Natural Moral Law the suffering and pain of animals inflicted through blood sports is only wrong if it leads to humans being cruel to humans. The death of animals in blood sports is a legitimate use of property. Some situationists may argue that animals should be treated agapeistically. Blood sports are generally not agapeic because most blood sports cause suffering or death, and therefore they cannot be justified.","However, modern understandings of Natural Moral Law promote a more caring attitude towards animals and question the morality of their use in blood sports. In Situation Ethics, there may be cases where blood sports can be justified. For example, fox hunting can be agapeic, on the grounds that foxes can inflict great damage on livestock. Hunting foxes is arguably more loving than factory farming and it also helps to conserve the environment."]},
{paper:"JUN26",qref:"4 (b)",ao:"AO2",type:"Assess",area:"Ethics",topic:"Situation Ethics",question:"'Situation Ethics is not a good way of making moral decisions.' Assess this view.",target:"AO2: Analyse and evaluate aspects of, and approaches to, religion and belief, including their significance, influence and study.",spec:"Normative ethical theories: Teleological: Situation Ethics with reference to Fletcher.",cap:"",content:["Some agree that Situation Ethics is not a good way of making moral decisions because it is too flexible and places too much emphasis on the individual. This emphasis on individual autonomy runs the risk of descending into antinomianism. However, Situation Ethics is a good way of making moral decisions because it is more flexible than religious legalism, promotes personalism and pragmatism, and empowers people to make decisions most relevant to their situation.","Some argue that by focussing solely on the Christian teaching of agape, Situation Ethics ignores other key religious moral teachings. However, others argue that the New Testament teaching which gives priority to the rule of love is the basis for Situation Ethics but does not exclude reference to other religious moral teachings. People of all religions and none may use Situation Ethics effectively.","Some argue that as a modern ethical system, Situation Ethics is less effective than traditional ethical systems based on religious law. Traditional systems offer better moral guidance because they are the product of centuries of experience and teaching. They provide clear moral guidelines which have stood the test of time. However, because Situation Ethics is not based on tradition and historical attitudes towards science and human behaviour, it is better because it can adapt more readily to modern technologies and developments in science."]}

    if (arr) arr.textContent = "";
  }
  var arrow = document.getElementById("arr-" + key);
  if (arrow) arrow.textContent = sortDir === 1 ? "\u25BE" : "\u25B4";
  render();
}

function setAoFilter(f, btn) {
  aoFilter = f;
  var bs = document.querySelectorAll("#ao-buttons button");
  for (var i = 0; i < bs.length; i++) bs[i].classList.remove("active");
  btn.classList.add("active");
  render();
}

function setTopicFilter(f, btn) {
  topicFilter = f;
  var bs = document.querySelectorAll("#topic-buttons button");
  for (var i = 0; i < bs.length; i++) bs[i].classList.remove("active");
  btn.classList.add("active");
  render();
}

buildTopicButtons();
render();
</script>
</body>
